pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Writable paths for non-root user (UID 1000)
    client_body_temp_path /tmp/client_body_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /tmp/nginx_access.log;
    error_log /tmp/nginx_error.log;

    server {
        listen 7860;
        server_name localhost;

        root /var/www/html/browser;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy /api requests directly to Spring Cloud API Gateway on port 8090
        # Note: No trailing slash on proxy_pass so that the /api prefix is preserved.
        location /api {
            proxy_pass http://127.0.0.1:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Optional: Cache static assets
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
            expires 1M;
            access_log off;
            add_header Cache-Control "public";
        }
    }
}
